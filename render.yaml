services:
  - type: web
    name: majdoorsaarthi-api
    runtime: node
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: PLATFORM_COMMISSION_RATE
        value: "0.05"
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: majdoorsaarthi-docs

  - type: web
    name: majdoorsaarthi-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && node ./node_modules/vite/bin/vite.js build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_ASSET_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
